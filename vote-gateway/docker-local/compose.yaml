name: vote-gateway-local

services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vote
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - vote-mysql-data:/var/lib/mysql

  vote-api:
    image: vote-api
    ports:
      - "8088:8088"
    environment:
      SPRING_FLYWAY_URL: jdbc:mysql://mysql:3306/vote
      SPRING_FLYWAY_USER: root
      SPRING_FLYWAY_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vote
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/vote
      SPRING_R2DBC_USERNAME: root
      SPRING_R2DBC_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  vote-adm:
    image: vote-adm
    ports:
      - "8089:8089"
    environment:
      SPRING_FLYWAY_URL: jdbc:mysql://mysql:3306/vote
      SPRING_FLYWAY_USER: root
      SPRING_FLYWAY_PASSWORD: root
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vote
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_R2DBC_URL: r2dbc:mysql://mysql:3306/vote
      SPRING_R2DBC_USERNAME: root
      SPRING_R2DBC_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  vote-mysql-data:
